[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-deployable-agentic-pcg"
version = "0.1.0"
description = "Reproducible local-model procedural content generation with a verified execution harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6",
  "PyYAML==6.0.3",
  "Pillow==12.3.0",
  "openai==3.8.0",
  "jsonschema==4.26.0",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
plots = ["matplotlib>=3.10,<4"]
lmstudio = ["lmstudio==1.5.0"]
transformers = ["torch", "transformers>=5.5.4", "peft", "accelerate", "xgrammar"]
cloud = ["anthropic>=0.40", "google-genai", "portkey-ai"]

[project.scripts]
pcg-reproduce = "experiments.reproduce:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["toolusepcg*", "experiments*", "scripts", "vendor*", "configs", "benchmarks*", "prompts"]
exclude = ["tests*", "docs*"]
namespaces = true

[tool.setuptools]
py-modules = ["main", "run_experiment", "render_trajectory", "analyze_trace"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.txt", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
